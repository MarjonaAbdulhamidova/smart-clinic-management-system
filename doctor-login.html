
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Clinic - Doctor Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e0f7fa, #dbeafe);
}
.login-card {
    width: 380px;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}
.logo { text-align: center; font-size: 42px; margin-bottom: 12px; }
h1 { text-align: center; color: #087e8b; font-size: 25px; margin-bottom: 8px; }
.subtitle { text-align: center; color: #718096; margin-bottom: 30px; }
label { display: block; margin-bottom: 8px; color: #334155; font-weight: bold; }
input {
    width: 100%; padding: 13px; border: 1px solid #cbd5e1;
    border-radius: 8px; margin-bottom: 20px; font-size: 15px;
}
button {
    width: 100%; padding: 14px; background: #087e8b; color: white;
    border: none; border-radius: 8px; font-size: 16px;
    font-weight: bold; cursor: pointer;
}
button:hover { background: #06616b; }
.footer { text-align: center; margin-top: 25px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<div class="login-card">
    <div class="logo">🩺</div>
    <h1>Smart Clinic</h1>
    <p class="subtitle">Doctor Portal</p>
    <form>
        <label for="email">Doctor Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <button type="submit">Sign In</button>
    </form>
    <div class="footer">© 2026 Smart Clinic Management System</div>
</div>
</body>
</html>
